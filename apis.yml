name: United Solar
description: >-
  United Solar (United Solar Polysilicon FZC SPC) is a clean-technology company producing
  ultra-high-purity polysilicon for the photovoltaic industry from one of the world's most
  advanced manufacturing facilities in Oman's Sohar Free Zone, with an annual capacity of
  100,000 metric tons supporting roughly 40 GW of solar module production. Backed by IDG
  Capital and the IFC, the company completed a $1.6 billion capital raise in 2026 and is
  the largest polysilicon producer of its kind outside China. United Solar is an industrial
  manufacturer and does not publish a developer portal or public APIs.
